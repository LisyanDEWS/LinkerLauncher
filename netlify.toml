# Netlify configuration.
#
# Build command and publish directory are intentionally NOT set here so the
# values configured in the Netlify UI stay in effect (file-based config would
# override them).

[build.environment]
  # The Firebase web config in src/lib/firebase.ts and src/lib/userFirebase.ts
  # is public by design: a Firebase apiKey identifies the project, it does not
  # grant access. Access is enforced by firestore.rules (owner-scoped,
  # deny-by-default) and Firebase Auth. Because the keys match Google's
  # "AIza..." shape, Netlify's secrets scanning smart detection flags them in
  # both the repo sources and the Vite bundle in dist/, which failed the build.
  #
  # This disables smart detection (pattern-based guessing) only. Scanning for
  # environment variables explicitly marked as secrets in Netlify still runs,
  # so real secrets remain protected.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
