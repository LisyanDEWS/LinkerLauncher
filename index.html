<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.ico" />
    <title>LinkerRu Launcher</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('linkerru_theme') || 'light';
          var c = localStorage.getItem('linkerru_contrast') === 'true';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.backgroundColor = c
            ? (t === 'dark' ? '#000000' : '#ffffff')
            : (t === 'dark' ? '#09090b' : '#fafafa');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
